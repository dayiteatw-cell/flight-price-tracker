name: Flight Price Tracker ✈️

on:
  schedule:
    # 每日清晨 01:00 台灣時間 (UTC+8) -> 17:00 UTC (前日)
    - cron: '0 17 * * *'
    # 每日上午 09:00 台灣時間 (UTC+8) -> 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上隨時手動點擊「Run workflow」

# 設定工作權限：允許提交代碼與發布 GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  track-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 檢出專案程式碼 (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python 3.11 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行機票智能監控與 LINE 戰報推播
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python flight_tracker.py

      - name: 自動提交最新資料庫變更至倉庫
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add price_history.csv price_history.xlsx dashboard.html index.html
          git diff --staged --quiet || (git commit -m "🤖 雲端定時巡邏：更新機票歷史數據與網頁 [skip ci]" && git push)

      - name: 準備 GitHub Pages 靜態網站目錄
        run: |
          mkdir -p _site
          cp index.html dashboard.html price_history.csv price_history.xlsx _site/

      - name: 上傳 GitHub Pages 構件
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 正式發布至 GitHub Pages 網址
        id: deployment
        uses: actions/deploy-pages@v4
